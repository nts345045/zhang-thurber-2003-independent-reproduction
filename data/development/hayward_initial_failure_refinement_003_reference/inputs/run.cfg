# Independent authoritative Hayward subset: km, km/s, s.
# Inputs and deviations from the manuscript: data/hayward/selection_manifest.json.
authoritative_ids_required 1
catalog_only_dd 1
iterations 18
stage_length 6
smoothing 10
damping 0.1
pair_distance 10
# The initial 32-ray audit converged 20/32 at 1km/400 and 32/32 at these settings.
ray_spacing 0.0625
ray_iterations 1000

# Assessed starting discretization; refinement is recorded separately.
ray_initializer 1
fmm_spacing 0.5